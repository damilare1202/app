<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2 class="heading">MY LITTLE PROJECT</h2>
    <p class="paragraph">DAMILARE LITTLE WORK</p>
    <form id="studentForm">
        <input type="text" id="name" placeholder="Name"> <br>
        <input type="number" id="age" placeholder="Age"> <br>
        <select id="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select> <br>
        <input type="number" id="score" placeholder="Score"> <br>
        <input type="text" id="studentClass" placeholder="Class"> <br>
        <button type="submit" id="submit">Add Student</button> <br>
    </form>

    <input type="text" id="search" placeholder="search by name(eg....)">
    <div id="summary"></div>
    <table id="studentTable"></table>

    <script src="./index.js"></script>
</body>

</html>
